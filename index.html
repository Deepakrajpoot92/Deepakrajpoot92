<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipkart iPhone 14 Pro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }
    .header {
      background-color: #2874f0;
      color: white;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 20px;
    }
    .product-img {
      text-align: center;
      margin: 20px;
    }
    .product-img img {
      max-width: 90%;
      height: auto;
    }
    .storage, .details, .price-box {
      background: white;
      padding: 15px;
      margin: 10px;
    }
    .btn-group {
      display: flex;
      justify-content: space-around;
      padding: 15px;
      background: white;
      position: sticky;
      bottom: 0;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    .add {
      background: #eee;
    }
    .buy {
      background: #ffbb00;
    }
    .off {
      color: green;
      font-weight: bold;
    }
    .cut {
      text-decoration: line-through;
      color: gray;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Flipkart <small style="font-size: 12px;">Lite</small></h1>
    <div>
      <input type="search" placeholder="Search...">
    </div>
  </div>

  <div class="product-img">
    <img src="https://fdn2.gsmarena.com/vv/pics/apple/apple-iphone-14-pro-max-1.jpg" alt="iPhone 14 Pro">
  </div>

  <div class="storage">
    <strong>Select Storage</strong>
    <div style="margin-top: 10px;">
      <button class="btn">1TB</button>
    </div>
  </div>

  <div class="details">
    <h3>APPLE iPhone 14 Pro</h3>
    <p><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/35/Flipkart_logo.png/320px-Flipkart_logo.png" alt="Plus Assured" width="80"> F-ASSURED</p>
  </div>

  <div class="price-box">
    <span class="off">99% off</span> &nbsp;
    <span class="cut">₹144,900.00</span> &nbsp;
    <strong>₹657.00</strong>
  </div>

  <div class="btn-group">
    <button class="btn add">Add to Cart</button>
    <button class="btn buy">Buy Now</button>
  </div>
</body>
</html>
